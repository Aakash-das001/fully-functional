<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Equation Methods with Quiz</title>

<!-- ✅ Bootstrap CSS added -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;  
    padding: 20px;
    background-color: #f0f8ff;
    box-sizing: border-box;
  }
  h1 {
    text-align: center;
    color: #0077cc;
  }

  .container-custom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .method, .quiz {
    background-color: #ffffff;
    border: 2px solid white;
    border-radius: 10px;
    padding: 15px;
    box-sizing: border-box;
    width: 100%;
  }
  .quiz {
    margin-top: 50px;
  }

  .equation {
    margin: 15px 0;
    font-size: clamp(14px, 2vw, 20px);
    word-wrap: break-word;
  }
  .tile { display: inline-block; width: 40px; height: 40px; background-color: #0077cc; vertical-align: middle; margin: 3px; }
  .dot { display: inline-block; width: 15px; height: 15px; border-radius: 50%; margin: 1px; }
  .red { background-color: red; }
  .green { background-color: green; }
  .stack { display: inline-block; vertical-align: middle; }
  .stack .dot { display: block; margin: 1px auto; }
  .result-tile { display: inline-block; width: 40px; height: 40px; border: 2px solid blue; line-height: 40px; vertical-align: middle; margin: 3px; font-size: clamp(16px, 2vw, 20px); text-align: center; color:blue}

  .eq2 { font-size: clamp(20px, 3vw, 36px); margin-bottom: 15px; word-wrap: break-word; }
  .move { display: inline-block; position: relative; transition: all 1s ease; }
  .answer { font-size: clamp(18px, 2.5vw, 36px); margin-top: 15px; opacity: 0; transition: opacity 1s ease; }

  #showSolutionBtn, #nextQuestionBtn {
    padding: 10px 20px;
    font-size: clamp(16px, 1.5vw, 22px);
    border-radius: 8px;
    border: 2px solid #0077cc;
    background-color: #0077cc;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
  }
  #showSolutionBtn:hover, #nextQuestionBtn:hover {
    background-color: #005fa3;
    border-color: #005fa3;
  }

  #nextQuestionBtn {
    display: none;
  }

  .question { font-size: clamp(16px, 2vw, 24px); margin: 15px 0; }

  .options { 
    display: flex; 
    flex-direction: row; 
    gap: 10px; 
    flex-wrap: wrap; 
    width: 100%;
  }

  .option { 
    padding: 8px; 
    font-size: clamp(14px, 1.5vw, 20px); 
    cursor: pointer; 
    border-radius: 8px; 
    border: 1px solid #0077cc; 
    background-color: #0077cc; 
    color: #fff; 
    transition: 0.3s; 
  }
  .option:hover { background-color: #005fa3; }
  .option:disabled {
    background-color: #ccc;
    border-color: #ccc;
    cursor: not-allowed;
  }

  .feedback { font-size: clamp(14px, 1.5vw, 20px); margin-top: 10px; font-weight: bold; }

  @media(max-width: 900px) { 
    .container-custom { grid-template-columns: 1fr; } 
  }
</style>
</head>
<body>

<!-- ✅ Bootstrap row/col added here -->
<div class="container-fluid">
  <div class="row">

    <!-- LEFT SIDE -->
    <div class="col-md-6 col-12">
      <div class="method">
        <h2>Method 1</h2>
        <h1 style="text-align:left">X - 3 = 8</h1>

        <div class="equation">
          <div class="tile"></div> - 
          <div class="dot red"></div>
          <div class="dot red"></div>
          <div class="dot red"></div>
          =
          <div class="dot green"></div><div class="dot green"></div><div class="dot green"></div>
          <div class="dot green"></div><div class="dot green"></div><div class="dot green"></div>
          <div class="dot green"></div><div class="dot green"></div>
        </div>

        <p>Add 3 green dots on both sides:</p>

        <h1 style="text-align:left">X - 3 <span style="color:green" >+ 3 </span>= 8 <span style="color:green">+ 3 </span></h1>

        <div class="equation">
          <div class="tile"></div>
          <div class="stack"><div class="dot red"></div><div class="dot green"></div></div>
          <div class="stack"><div class="dot red"></div><div class="dot green"></div></div>
          <div class="stack"><div class="dot red"></div><div class="dot green"></div></div>
          =
          <div class="dot green"></div><div class="dot green"></div><div class="dot green"></div>
          <div class="dot green"></div><div class="dot green"></div><div class="dot green"></div>
          <div class="dot green"></div><div class="dot green"></div>&nbsp;&nbsp;&nbsp;&nbsp;
          <div class="dot green"></div><div class="dot green"></div><div class="dot green"></div>
        </div>

        <p>Remove red and green pairs:</p>

        <div class="equation">
          <div class="result-tile">x</div> =
          <div class="result-tile">11</div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="col-md-6 col-12">
      <div class="method">
        <h2>Method 2</h2>
        <h1 style="text-align:left">X - 3 = 8</h1>

        <div class="eq2">
          <span>x</span>
          <span class="move" id="minus3"> - 3 </span>
          <span>=</span>
          <span id="rhs">8</span>
        </div>

        <div class="answer" id="answer">x = 11</div>
        <button id="showSolutionBtn">Show Solution</button>
      </div>

      <div class="quiz">
        <h2>Equation Quiz</h2>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button id="nextQuestionBtn">Next Question ➡️</button>
      </div>
    </div>

  </div>
</div>

<script>
// Method 2 animation
function showSolution() {
  const minus3 = document.getElementById('minus3');
  const rhs = document.getElementById('rhs');
  const answer = document.getElementById('answer');

  minus3.style.display = "inline-block";
  minus3.style.opacity = "1";
  minus3.style.transform = "translateX(0px) translateY(0px)";
  rhs.textContent = "8";
  answer.style.opacity = 0;

  setTimeout(() => {
    minus3.style.transform = "translateX(60px) translateY(-5px)";
    minus3.style.opacity = "0";

    setTimeout(() => {
      rhs.textContent = "8 + 3";
      minus3.style.display = "none";
      answer.style.opacity = 1;
    }, 1000);
  }, 50);
}

document.getElementById('showSolutionBtn').addEventListener('click', showSolution);

// QUIZ
function generateQuestion() {
  const a = Math.floor(Math.random() * 10) + 1;
  const b = Math.floor(Math.random() * 20) - 5;
  const operator = Math.random() < 0.5 ? '+' : '-';
  let correctAnswer;
  let questionText;

  if(operator === '+') {
    correctAnswer = b - a;
    questionText = `Solve: x + ${a} = ${b}`;
  } else {
    correctAnswer = b + a;
    questionText = `Solve: x - ${a} = ${b}`;
  }
  window.correctAnswer = correctAnswer;

  const questionDiv = document.getElementById("question");
  const optionsDiv = document.getElementById("options");
  const nextBtn = document.getElementById("nextQuestionBtn");
  
  questionDiv.innerText = questionText;
  optionsDiv.innerHTML = "";
  nextBtn.style.display = "none";

  let answers = new Set([correctAnswer]);
  while(answers.size < 4) {
    const wrong = correctAnswer + Math.floor(Math.random()*5)-2;
    if(wrong !== correctAnswer) answers.add(wrong);
  }

  Array.from(answers).sort(() => Math.random() - 0.5).forEach(ans => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = `x = ${ans}`;
    btn.addEventListener('click', () => checkAnswer(btn));
    optionsDiv.appendChild(btn);
  });

  document.getElementById("feedback").innerText = "";
}

function checkAnswer(button) {
  const userAnswer = parseInt(button.innerText.split('=')[1].trim());
  const feedback = document.getElementById("feedback");
  const optionsDiv = document.getElementById("options");
  const nextBtn = document.getElementById("nextQuestionBtn");
  
  if(userAnswer === window.correctAnswer){
    feedback.innerText = "✅ Correct! Great job!";
    feedback.style.color = "green";
    
    // Disable all option buttons
    const allOptions = optionsDiv.querySelectorAll('.option');
    allOptions.forEach(opt => opt.disabled = true);
    
    // Show next question button
    nextBtn.style.display = "inline-block";
  } else {
    feedback.innerText = "❌ Wrong! Try Again.";
    feedback.style.color = "red";
  }
}

// Next Question button event
document.getElementById('nextQuestionBtn').addEventListener('click', generateQuestion);

generateQuestion();
</script>

</body>
</html>
